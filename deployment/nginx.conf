# Day 18 · Phase I — nginx reverse proxy for the AI Venture Intelligence Platform.
# Mounted at /etc/nginx/conf.d/default.conf by the docker-compose `proxy` profile.
# Jobs: TLS termination (see the commented 443 block), rate limiting, gzip, and forwarding to the API.
# NOTE: nginx is not installed in the authoring environment — this was written + brace/structure-checked,
# not `nginx -t`-verified. Validate on the host with `nginx -t` before going live.

# Rate limit: ~10 requests/second per client IP (the /analyze path is heavy). `http{}` context.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream avip_api {
    server api:8000;                 # the compose service name
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;         # requests are tiny JSON campaigns — cap the body size
    gzip on;
    gzip_types application/json;

    # Probes: forwarded, never rate-limited, no access-log noise.
    location ~ ^/(live|ready|health)$ {
        proxy_pass http://avip_api;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;   # allow short bursts, then throttle
        proxy_pass http://avip_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;          # /analyze is ~3s warm; generous headroom
    }
}

