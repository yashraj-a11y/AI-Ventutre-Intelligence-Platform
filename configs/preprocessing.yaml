# =============================================================================
# preprocessing.yaml
# Configuration contract for the Day 2 Stage-1 preprocessing pipeline
# (AI Venture Intelligence Platform — Roadmap V1.2, FROZEN).
#
# Stage-1 = dataset cleaning (row-changing). Stage-2 keys (encoding / scaling /
# TF-IDF) are under `day3_reserved` and are NOT consumed in Day 2.
# =============================================================================

version: "1.2.0"

dataset:
  name: "Kickstarter Projects"
  raw_path: "data/raw/ks-projects-201801.csv"
  processed_path: "data/processed/kickstarter_processed.csv"
  quarantine_path: "data/interim/quarantined_invalid_rows.csv"

# --- Phase A: schema contract (actual 15 columns; no assumed columns) ---------
schema:
  required_columns:
    - ID
    - name
    - category
    - main_category
    - currency
    - deadline
    - goal
    - launched
    - pledged
    - state
    - backers
    - country
    - usd pledged
    - usd_pledged_real
    - usd_goal_real

# --- Phase B: column governance ----------------------------------------------
columns:
  identifier:
    - ID
  # Post-event columns that leak the outcome -> removed before modeling.
  leakage_drop:
    - pledged
    - usd pledged
    - usd_pledged_real
    - backers
  # Known at launch -> retained.
  keep_numeric:
    - goal
    - usd_goal_real

# --- Phase G: target contract -------------------------------------------------
target:
  source_column: state
  positive_state: successful
  decided_states:
    - successful
    - failed
  excluded_states:
    - live
    - canceled
    - suspended
    - undefined
  target_column: target        # successful -> 1, failed -> 0

# --- Phase C: missing-value strategy -----------------------------------------
missing:
  numeric_strategy: median     # mean | median  (median: robust to skew)
  categorical_strategy: mode   # mode | unknown
  categorical_fill: "Unknown"
  text_columns:
    - name
  text_fill: ""
  # NOTE: country == 'N,0"' is a non-null STRING sentinel, not a NaN.
  # It is handled by Phase F integrity (V7), NOT imputed here.

# --- Phase E: datatype targets ------------------------------------------------
datatypes:
  datetime_columns:
    - launched
    - deadline
  category_columns:
    - category
    - main_category
    - currency
    - country
  numeric_columns:
    - goal
    - usd_goal_real

# --- Phase F: business-integrity rules (V1–V8) --------------------------------
integrity:
  min_goal: 0.01                 # V1: goal > 0
  min_duration_days: 1           # V2: duration > 0
  max_duration_days: 90          # V3: duration <= 90 (flag)
  epoch_sentinel_year: 1970      # V5: launched != epoch sentinel
  corrupt_country_sentinel: 'N,0"'   # V7: quarantine & remove
  valid_states:                  # V6
    - successful
    - failed
    - canceled
    - live
    - undefined
    - suspended

logging:
  level: INFO
  log_file: "outputs/logs/preprocessing.log"

# =============================================================================
# DAY 3 (Stage 2 — row-preserving feature transforms). Frozen spec V1.2.
# See docs/day3_roadmap.md. Values corrected from the old `day3_reserved`
# forward-reference so there is ONE source of truth.
# =============================================================================
day3:
  # --- Phase 0: train/test split (the leakage foundation) --------------------
  # Fit every downstream transformer on TRAIN ONLY; transform test.
  split:
    test_size: 0.2
    random_state: 42
    stratify: true               # stratify on target -> preserve ~40/60 balance
    target_column: target        # Day-2 label (successful=1, failed=0)
    leak_columns:                # NOT features — removed from X before modeling
      - state                    # perfect leak: state directly determines target
    artifacts_dir: artifacts/splits

  # --- Phase A: exploratory feature analysis (train-only) --------------------
  profiling:
    skew_threshold: 1.0          # |skew| above this -> recommend log1p
    onehot_max_cardinality: 25   # <= this -> one-hot; above -> frequency-encode
    corr_threshold: 0.9          # |corr| above this -> drop one of the pair
    numeric: [goal, usd_goal_real]
    categorical: [category, main_category, currency, country]
    text: name_clean
    dates: [launched, deadline]

  # --- Phase F: domain feature engineering (pre-launch, leakage-free) ---------
  # Runs FIRST in the pipeline; creates columns the numeric branch then transforms.
  feature_builder:
    launched_col: launched
    deadline_col: deadline
    title_col: name              # RAW title (casing/digits are the style signal)
    goal_col: goal
    min_duration_days: 1         # guard: clip duration denominator so goal/0 never happens

  # --- Phase G: text preprocessing (Week 1; NLTK path) -----------------------
  text:
    input_col: name_clean
    output_col: name_processed
    min_token_length: 2
    remove_stopwords: true
    lemmatize: true
    keep_words: []               # domain words to retain despite being stopwords

  # --- Phase H: TF-IDF vectorization (Week 2; fit vocab+idf on TRAIN only) ----
  tfidf:
    input_col: name_processed
    max_features: 800            # titles ~6 words -> 800, NOT 2500
    ngram_range: [1, 2]          # unigrams + bigrams ("board game")
    min_df: 2                    # drop terms in <2 docs (hapax noise)
    max_df: 0.95                 # drop terms in >95% of docs
    sublinear_tf: false

  # --- Phase J: multi-modal fusion (sparse hstack of the three blocks) --------
  fusion:
    order: [text, categorical, numeric]   # column layout of the fused matrix

  # --- Phase K: feature selection (fit on train) -----------------------------
  selection:
    variance_threshold: 0.0      # drop (near-)constant columns
    correlated_pairs: [[goal, usd_goal_real]]   # Phase A: pearson 0.957
    corr_threshold: 0.9          # drop lower-MI member if |corr| >= this
    top_k: null                  # null = keep all survivors; else keep top-k by MI
    mi_subsample: 40000          # rows sampled for mutual-information estimation
    random_state: 42

  # --- Phase C: numerical transformation -------------------------------------
  transform:
    method: log1p                # log1p | yeo-johnson
    columns: [goal, usd_goal_real, goal_per_day]   # goal_per_day if Phase F built it

  # --- Phase D: outlier treatment (cap/winsorize only — NEVER drop rows) ------
  outliers:
    method: iqr                  # iqr | percentile
    iqr_multiplier: 1.5          # Tukey fences: [Q1 - k*IQR, Q3 + k*IQR]
    lower_quantile: 0.01         # used when method: percentile
    upper_quantile: 0.99
    columns: [goal, usd_goal_real, goal_per_day]

  # --- Phase E: feature scaling (numeric branch; toggle for tree models) ------
  scaling:
    method: standard             # standard | robust | minmax | maxabs
    enabled: true                # false -> pass-through (tree models don't need scaling)
    columns: &numeric_features   # scale ALL numeric features (log applied only to skewed)
      - goal
      - usd_goal_real
      - goal_per_day
      - campaign_duration
      - launch_year
      - launch_month
      - launch_weekday
      - launch_quarter
      - is_weekend_launch
      - title_length
      - word_count
      - avg_word_length
      - uppercase_ratio
      - has_number

  # --- Phase L: pipeline assembly --------------------------------------------
  numeric_features: *numeric_features   # the numeric block the pipeline slices/fuses

  # --- Phase B: categorical encoding -----------------------------------------
  encoding:
    low_cardinality_onehot: [main_category, currency, country]
    frequency_encode: [category] # 159 levels -> frequency  (was: one_hot all)


# =============================================================================
# DAY 4 — Prediction Engine (Architecture Layer 4). See docs/day4_roadmap.md.
# =============================================================================
day4:
  # --- Phase B: validation-from-train split (test set is untouched holdout) ---
  split:
    fused_dir: artifacts/fused_features
    val_size: 0.2                # fraction of TRAIN carved off for validation
    n_splits: 5                  # stratified k-fold for tuning/calibration
    random_state: 42

  # --- Phase C: Logistic Regression baseline (mandatory Week 6) ---------------
  logreg:
    penalties: [l2, l1, elasticnet]   # L2 mandatory; L1 + ElasticNet for comparison
    C: 1.0                       # inverse regularization strength
    l1_ratio: 0.5                # ElasticNet mix (0=L2 .. 1=L1)
    solver: saga                 # only saga does L1/ElasticNet on large sparse data
    max_iter: 1000
    class_weight: null           # null | balanced (for the 40/60 imbalance)
    random_state: 42
    feature_names_path: artifacts/feature_pipeline/feature_metadata.json

  # --- Phase D: classical ML benchmarking ------------------------------------
  benchmark:
    models: [random_forest, extra_trees, xgboost, lightgbm, hist_gradient_boosting]
    n_estimators: 200            # trees / boosting rounds
    n_jobs: -1
    random_state: 42
    report_path: docs/day4_benchmark_report.md
    json_path: artifacts/evaluations/benchmark.json

  # --- Phase E: hyperparameter optimization ----------------------------------
  tuning:
    model: lightgbm              # tune the Phase-D winner
    n_iter: 25                   # RandomizedSearchCV candidates
    cv: 3                        # stratified folds (3 to bound runtime)
    scoring: average_precision   # PR-AUC (primary metric)
    random_state: 42
    best_config_path: artifacts/models/best_config.json

  # --- Phase F: probability calibration --------------------------------------
  calibration:
    methods: [sigmoid, isotonic] # Platt (sigmoid) + Isotonic
    cv: 5                        # internal CV for cross-fitted calibration (on fit set)
    n_bins: 10                   # reliability-curve bins
    plot_path: artifacts/evaluations/calibration_curve.png
    model_path: artifacts/models/calibrated_model.joblib

  # --- Phase G: venture scores (honesty tiers) -------------------------------
  venture_scores:
    readiness_high: 0.66         # calibrated p >= this -> "High"
    readiness_medium: 0.40       # >= this -> "Medium"; else "Low"
    # Scores with NO data basis in this dataset — never fabricated, returned as deferred.
    deferred: [founder_strength, market_fit, business_model, scalability, growth_potential]

  # --- Phase H: prediction engine (raw campaign -> full prediction) -----------
  prediction_engine:
    pipeline_path: artifacts/feature_pipeline/feature_pipeline.joblib
    model_path: artifacts/models/calibrated_model.joblib
    calibration_path: artifacts/evaluations/calibration.json   # source of the F1-optimal threshold
    threshold: null              # null -> load F1-optimal from calibration.json; else a float

  # --- Phase I: model serialization & versioning -----------------------------
  serialization:
    version: "1.0.0"
    model_dir: artifacts/models
    metadata_path: artifacts/models/model_metadata.json
    feature_pipeline_path: artifacts/feature_pipeline/feature_pipeline.joblib
    dataset_path: data/processed/kickstarter_processed.csv

  # --- Phase J: final evaluation on the untouched TEST set (scored ONCE) ------
  evaluation:
    model_path: artifacts/models/calibrated_model.joblib
    plots_dir: artifacts/evaluations
    report_path: docs/day4_model_report.md
    benchmark_json: artifacts/evaluations/benchmark.json
    calibration_json: artifacts/evaluations/calibration.json

# ============================================================================
# Day 5 — Explainability Engine (Layer 5, Week 7)
# ============================================================================
day5:
  # --- Phase B: global feature importance (gain + split + mean|SHAP|) ---------
  global_importance:
    fused_dir: artifacts/fused_features
    model_path: artifacts/models/best_model.joblib          # base LightGBM (SHAP-able)
    feature_meta_path: artifacts/feature_pipeline/feature_metadata.json
    shap_subsample: 2000         # densified rows for mean|SHAP| (never 66k x 865)
    shap_background: 100         # background rows for INTERVENTIONAL TreeSHAP (masker default)
    shap_additivity_tol: 0.001   # max |expected+Σshap - margin| allowed (correctness guard)
    random_state: 42
    top_k: 50
    out_dir: artifacts/explainability
    csv_path: artifacts/explainability/global_importance.csv
    report_path: docs/day5_global_importance_report.md

  # --- Phase C: logistic-regression coefficient analysis (mandatory Week 7) ---
  coefficient_analysis:
    model_path: artifacts/models/logistic_regression.joblib   # L2 LogReg (white-box)
    feature_meta_path: artifacts/feature_pipeline/feature_metadata.json
    global_importance_csv: artifacts/explainability/global_importance.csv  # for cross-model agreement
    top_k: 25                    # top +/- coefficients to tabulate
    agreement_top_n: 20          # top-N overlap between |coef| and mean|SHAP|
    out_dir: artifacts/explainability
    csv_path: artifacts/explainability/coefficients.csv
    report_path: docs/day5_coefficient_report.md

  # --- Phase D: SHAP explainability engine (base LightGBM, interventional) -----
  shap:
    model_path: artifacts/models/best_model.joblib   # base tuned LightGBM (SHAP-able)
    fused_dir: artifacts/fused_features
    feature_meta_path: artifacts/feature_pipeline/feature_metadata.json
    subsample: 2000              # rows to explain for global/summary (densified ~13MB)
    background: 100              # interventional reference sample (masker default)
    additivity_tol: 0.001        # correctness guard on expected+Σshap ≈ margin
    random_state: 42
    out_path: artifacts/explainability/shap_values.pkl

  # --- Phase E: local (per-campaign) explanation ------------------------------
  local:
    top_k: 8                     # top +/- real-feature contributions to surface
    examples_path: artifacts/explainability/local_explanation_examples.json

  # --- Phase F: feature-importance visualizations (mandatory Week 7) -----------
  visualization:
    out_dir: artifacts/visualizations
    global_importance_csv: artifacts/explainability/global_importance.csv
    coefficients_csv: artifacts/explainability/coefficients.csv
    shap_values_pkl: artifacts/explainability/shap_values.pkl
    fused_dir: artifacts/fused_features
    top_n: 20                    # bars/beeswarm show top-N features
    waterfall_row: 0             # which subsample row to draw a waterfall for
    dpi: 130

  # --- Phase G: human-readable explanation generator --------------------------
  explanation:
    max_factors: 4               # how many +/- factors to verbalize per campaign
    z_high: 0.4                  # |standardized value| above this -> "high"/"low"
    n_examples: 6                # campaigns to verbalize for the deliverable
    examples_path: artifacts/explainability/explanation_examples.json

  # --- Phase H: Venture Copilot (honesty-tiered advisory layer) ----------------
  copilot:
    max_factors: 4               # real-feature strengths/weaknesses to surface
    n_examples: 4                # campaigns to brief for the deliverable
    briefs_path: artifacts/explainability/copilot_briefs.json

  # --- Phase I: end-to-end explainability pipeline (raw -> full bundle) --------
  pipeline:
    top_k_global: 15             # top features in the global-context summary
    global_importance_csv: artifacts/explainability/global_importance.csv
    coefficients_csv: artifacts/explainability/coefficients.csv
    report_path: artifacts/explainability/explainability_report_examples.json

# ============================================================================
# Day 6 — Venture Knowledge Base & Semantic Retrieval (Layers 2/3)
# ============================================================================
day6:
  # --- Phase B: venture knowledge base (train-split historical records) --------
  knowledge_base:
    processed_path: data/processed/kickstarter_processed.csv
    split_dir: artifacts/splits
    use_split: train             # build KB from TRAIN rows only (leakage-free)
    subsample: null              # null = all train (265k); else an int for fast dev
    random_state: 42
    out_dir: artifacts/embeddings
    metadata_csv: artifacts/embeddings/metadata.csv     # full table (pyarrow absent -> csv)
    manifest_path: artifacts/embeddings/metadata.json   # compact schema + summary + samples

  # --- Phase C: SBERT embedding generation (dense semantic vectors) ------------
  embedding:
    model_name: all-MiniLM-L6-v2   # SBERT primary, 384-dim, lightweight
    batch_size: 256
    normalize: true                # L2-normalize -> cosine == dot product (FAISS IP)
    device: cpu                    # matches benchmark; override to mps/cuda if available
    out_dir: artifacts/embeddings
    embeddings_path: artifacts/embeddings/startup_embeddings.npy
    model_info_path: artifacts/embeddings/embedding_model.json
    # NB: no independent subsample here — embeddings must stay row-aligned with the
    # Phase-B metadata. For fast dev, set day6.knowledge_base.subsample instead.

  # --- Phase D: FAISS vector database (exact cosine via inner product) ---------
  vector_db:
    index_type: flat_ip          # IndexFlatIP on normalized vectors = exact cosine
    embeddings_path: artifacts/embeddings/startup_embeddings.npy
    model_info_path: artifacts/embeddings/embedding_model.json
    metadata_csv: artifacts/embeddings/metadata.csv
    out_dir: artifacts/vector_db
    index_path: artifacts/vector_db/faiss.index
    mapping_path: artifacts/vector_db/mapping.json

  # --- Phase E: semantic search engine (query -> ranked similar campaigns) -----
  semantic_search:
    metadata_csv: artifacts/embeddings/metadata.csv
    default_k: 5
    pool_factor: 20              # over-fetch k*this when filtering/excluding
    min_pool: 300                # minimum over-fetch pool

  # --- Phase F: historical venture retriever (Layer-3 core) --------------------
  venture_retriever:
    k: 5                         # neighbors surfaced per list
    benchmark_pool: 50           # nearest neighbors used for funding benchmark + kNN prior
    examples_path: artifacts/retrieval/retrieval_examples.json

  # --- Phase G: retrieval evidence generator (structured + readable) -----------
  evidence:
    n_examples: 4
    prior_model_agree_tol: 0.1   # |kNN prior - model prob| <= this => "corroborates"
    examples_path: artifacts/retrieval/evidence_examples.json

  # --- Phase H: venture intelligence pipeline (prediction + evidence) ----------
  pipeline:
    attach_prediction: true      # attach Day-4 calibrated probability alongside evidence
    n_examples: 3
    report_path: artifacts/retrieval/intelligence_report_examples.json

  # --- Phase I: knowledge base serialization (versioned, tamper-evident) -------
  serialization:
    version: "1.0.0"
    manifest_path: artifacts/vector_db/knowledge_base_manifest.json
    artifacts:
      embeddings: artifacts/embeddings/startup_embeddings.npy
      faiss_index: artifacts/vector_db/faiss.index
      metadata_csv: artifacts/embeddings/metadata.csv
      mapping: artifacts/vector_db/mapping.json
      embedding_model_json: artifacts/embeddings/embedding_model.json

# ============================================================================
# Day 7 — Pattern Mining Engine (Layer 6)
# ============================================================================
day7:
  # --- shared mining core: discretized real-feature item frame + rule stats ---
  mining:
    processed_path: data/processed/kickstarter_processed.csv
    split_dir: artifacts/splits
    use_split: train                 # mine train-only (patterns validatable on test)
    min_support_count: 500           # ~0.2% of 265k — kills small-sample noise
    single_features: [main_category, category, country, currency, goal_band,
                      launch_year, launch_quarter, launch_weekday, is_weekend_launch,
                      duration_band, word_count_band, has_number]
    pair_features: [main_category, goal_band, country, launch_quarter,
                    duration_band, word_count_band, has_number]

  # --- Phase B: success pattern mining (rules -> funded, lift > 1) -------------
  success:
    min_lift: 1.15                   # effect size: >=15% above base rate
    max_pvalue: 0.05                 # chi-square significance (Bonferroni in Phase F)
    top_k: 25
    out_path: artifacts/patterns/success_patterns.json

  # --- Phase C: failure pattern mining (rules -> failed, funding lift < 1) -----
  failure:
    max_lift: 0.85                   # funding lift <=0.85 (>=15% below the 0.4038 base)
    max_pvalue: 0.05
    top_k: 25
    out_path: artifacts/patterns/failure_patterns.json

  # --- Phase D: funding pattern discovery (category goal thresholds + combos) ---
  funding:
    category_min_support: 100        # min campaigns per (category, band) cell
    top_combos: 15                   # strongest 2-feature funding drivers
    out_path: artifacts/patterns/funding_patterns.json

  # --- Phase E: temporal / timing patterns (reframed from "growth") ------------
  temporal:
    min_support_count: 300           # per timing cell
    out_path: artifacts/patterns/growth_patterns.json

  # --- Phase F: statistical pattern ranking (Bonferroni + effect size) ---------
  ranker:
    alpha: 0.05                      # family-wise error rate (before correction)
    min_abs_lift: 0.15               # effect size: |lift - 1| >= this
    top_k: 40
    out_path: artifacts/patterns/ranked_patterns.csv

  # --- Phase G: pattern explanation generator (readable + honesty caption) -----
  explanation:
    top_k: 15
    out_path: artifacts/patterns/pattern_explanations.json

  # --- Phase H: pattern knowledge repository (organized, provenance-tagged) ----
  repository:
    version: "1.0.0"
    sources:
      success: artifacts/patterns/success_patterns.json
      failure: artifacts/patterns/failure_patterns.json
      funding: artifacts/patterns/funding_patterns.json
      temporal: artifacts/patterns/growth_patterns.json
      explanations: artifacts/patterns/pattern_explanations.json
    out_path: artifacts/patterns/pattern_repository.json

  # --- Phase I: pattern mining pipeline (mine-once -> cluster -> rank -> store) -
  pipeline:
    n_clusters: 25                   # MiniBatchKMeans on Day-6 embeddings
    embeddings_path: artifacts/embeddings/startup_embeddings.npy
    cluster_random_state: 42
    top_explanations: 15
    report_path: artifacts/patterns/pattern_mining_report.json

# ============================================================================
# Day 8 — Counterfactual Engine (Layer 7)
# ============================================================================
day8:
  # --- Phase B: counterfactual candidate generator (mutable features only) -----
  candidates:
    funding_patterns_path: artifacts/patterns/funding_patterns.json  # Day-7 category goal medians
    goal_floor: 100                  # never propose an absurdly low goal
    goal_multiples: [0.5]            # extra goal reductions of current usd_goal_real
    target_durations: [15, 30]       # Kickstarter sweet spots (Day-7: shorter funds better)
    best_weekday: Tuesday            # Day-7 best-lift weekday
    enable_title: true               # coarse has_number candidate (suggestive tier)
    mutable: [goal, campaign_duration, launch_weekday, title]
    immutable: [country, currency]   # NEVER recommend (gaming, not advice)

  # --- Phase C: funding probability simulator (perturb -> re-run Day-4 model) ---
  simulator:
    min_gain: 0.005                  # min cumulative gain to add a step in the greedy plan
    predict_cols: [name, category, main_category, currency, deadline, goal,
                   launched, country, usd_goal_real, name_clean]

  # --- Phase D: historical evidence validation (real Day-7 patterns) ----------
  evidence:
    min_subgroup_n: 100              # min campaigns for category-specific evidence; else global

  # --- Phase E: improvement ranking engine (gain x evidence x feasibility) -----
  ranking:
    min_delta: 0.005                 # drop negligible/negative-gain recommendations
    tier_weights: {strong: 1.0, moderate: 0.85, suggestive: 0.7}
    feasibility: {goal: 1.0, campaign_duration: 1.0, launch_weekday: 0.9, title: 0.8}
    evidence_lift_cap: 1.8           # clip evidence lift so one huge lift can't dominate

  # --- Phase G: counterfactual pipeline (raw -> ranked plan) -------------------
  pipeline:
    n_examples: 3
    recommendations_path: artifacts/counterfactual/recommendations.json
    scenario_results_path: artifacts/counterfactual/scenario_results.json
    ranked_actions_path: artifacts/counterfactual/ranked_actions.csv

  # --- Phase H: startup optimization report -----------------------------------
  report:
    top_n: 5
    n_examples: 3
    out_path: artifacts/counterfactual/optimization_report.json

  # --- Phase I: counterfactual engine serialization (config + hashes) ----------
  serialization:
    version: "1.0.0"
    manifest_path: artifacts/counterfactual/counterfactual_engine.json
    dependencies:
      day4_calibrated_model: artifacts/models/calibrated_model.joblib
      day7_funding_patterns: artifacts/patterns/funding_patterns.json
      day7_pattern_repository: artifacts/patterns/pattern_repository.json
    artifacts:
      recommendations: artifacts/counterfactual/recommendations.json
      scenario_results: artifacts/counterfactual/scenario_results.json
      optimization_report: artifacts/counterfactual/optimization_report.json

# ============================================================================
# Day 9 — Investor Objection Simulator & Venture Copilot (Layer 8)
# ============================================================================
day9:
  # --- Phase B: investor objection generator (structured dimensions) -----------
  objections:
    severity_high: 0.40              # normalized concern-score thresholds
    severity_medium: 0.20
    goal_high_ratio: 1.3             # goal > category funded-median x this -> fire goal objection
    lift_concern: 0.9                # dimension lift below this -> fire objection
    min_cohort_n: 100
    out_path: artifacts/copilot/investor_questions.json

  # --- Phase C: risk analysis engine (real assessable risk categories) ---------
  risk:
    severity_high: 0.40
    severity_medium: 0.20
    goal_high_ratio: 1.3
    lift_concern: 0.9
    out_path: artifacts/copilot/risk_report.json

  # --- Phase D: SWOT analysis engine (real-signal SWOT) -----------------------
  swot:
    top_k: 4
    lift_concern: 0.9
    out_path: artifacts/copilot/swot_report.json

  # --- Phase E: category & segment analysis (own-data "market" read) -----------
  market:
    min_year_n: 100                  # min campaigns per (category, year) cell
    crowded_high: 25000              # category volume thresholds -> crowding label
    crowded_mid: 12000
    crowded_low: 5000
    favorable_lift: 1.1
    challenging_lift: 0.9
    out_path: artifacts/copilot/market_analysis.json

  # --- Phase F: category competition analysis (own-data "competitor" read) -----
  competition:
    crowded_high: 25000
    crowded_mid: 12000
    crowded_low: 5000
    struggler_goal_ratio: 1.3        # goal > funded-median x this -> positioned like strugglers
    out_path: artifacts/copilot/competitor_analysis.json

  # --- Phase G: strategic recommendation engine (Day-8 levers + framing) -------
  recommendations:
    out_path: artifacts/copilot/recommendations.json

  # --- Phase H: venture copilot pipeline (integrate all layers) ----------------
  copilot_pipeline:
    n_examples: 3
    out_path: artifacts/copilot/venture_copilot_brief.json

  # --- Phase I: venture copilot serialization (config + hashes) ----------------
  serialization:
    version: "1.0.0"
    manifest_path: artifacts/copilot/venture_copilot.json
    dependencies:
      day4_calibrated_model: artifacts/models/calibrated_model.joblib
      day5_base_model: artifacts/models/best_model.joblib
      day7_funding_patterns: artifacts/patterns/funding_patterns.json
      day8_counterfactual_engine: artifacts/counterfactual/counterfactual_engine.json
